name: Build Kernel (mt6768)

on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Override devices (comma separated, blank = DEVICES from ksun.env)"
        required: false
        default: ""
      release:
        description: "Publish a GitHub release"
        type: boolean
        default: false
  push:
    paths: [ "ksun.env", ".github/workflows/build.yml", "patches/**" ]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: ksun.env, sparse-checkout-cone-mode: false }
      - id: m
        run: |
          set -e
          DEV="${{ github.event.inputs.devices }}"
          [ -z "$DEV" ] && DEV=$(grep -E '^DEVICES=' ksun.env | cut -d= -f2-)
          echo "matrix=$(python3 -c "import json,sys;print(json.dumps({'device':[d.strip() for d in sys.argv[1].split(',') if d.strip()]}))" "$DEV")" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Load ksun.env
        uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Parse config into env
        run: |
          # last-wins, strips comments/blank lines, keeps values containing '='
          grep -E '^[A-Z0-9_]+=' ksun.env | while IFS= read -r l; do
            k="${l%%=*}"; v="${l#*=}"
            printf '%s<<__EOF__\n%s\n__EOF__\n' "$k" "$v" >> "$GITHUB_ENV"
          done

      - name: Checkout external kernel source
        if: env.KERNEL_SOURCE != ''
        run: |
          # keep this repo's patches/ before the checkout is replaced by the kernel source
          mkdir -p "$RUNNER_TEMP/patches" && cp -r patches/. "$RUNNER_TEMP/patches/" 2>/dev/null || true
          rm -rf ./* .[!.]*  || true
          git clone --depth=1 -b "$KERNEL_SOURCE_BRANCH" "$KERNEL_SOURCE" .

      - name: Free disk space
        if: env.REMOVE_UNUSED_PACKAGES == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean; df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev \
            zstd xz-utils cpio lz4 ccache dos2unix device-tree-compiler python3 zip unzip curl \
            git make build-essential libncurses-dev binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          if [ "$ENABLE_PYTHON2" = "true" ]; then sudo apt-get install -y python2 || true; fi

      - name: Restore ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.device }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.device }}-

      - name: Fetch toolchains
        run: |
          mkdir -p "$HOME/tc" && cd "$HOME/tc"
          if [ "$USE_CLANG" = "true" ]; then
            mkdir clang
            case "$CLANG_SOURCE" in
              *.tar.zst) curl -fL "$CLANG_SOURCE" | tar --zstd -xf - -C clang ;;
              *.tar.gz|*.tgz) curl -fL "$CLANG_SOURCE" | tar -xzf - -C clang ;;
              *.tar.xz) curl -fL "$CLANG_SOURCE" | tar -xJf - -C clang ;;
              *) git clone --depth=1 ${CLANG_BRANCH:+-b "$CLANG_BRANCH"} "$CLANG_SOURCE" clang ;;
            esac
            # flatten if the archive had one top-level dir
            if [ ! -d clang/bin ] && [ "$(ls clang | wc -l)" = 1 ]; then mv clang/*/* clang/ 2>/dev/null || true; fi
            echo "$HOME/tc/clang/bin" >> "$GITHUB_PATH"
          fi
          if [ "$USE_GCC_64" = "true" ]; then
            mkdir gcc64 && curl -fL "$GCC_64_SOURCE" | tar -xJf - -C gcc64 --strip-components=1
            echo "$HOME/tc/gcc64/bin" >> "$GITHUB_PATH"
          fi
          if [ "$USE_GCC_32" = "true" ]; then
            mkdir gcc32 && curl -fL "$GCC_32_SOURCE" | tar -xJf - -C gcc32 --strip-components=1
            echo "$HOME/tc/gcc32/bin" >> "$GITHUB_PATH"
          fi

      - name: Apply patches
        run: |
          shopt -s nullglob
          PDIR=patches; [ -d "$RUNNER_TEMP/patches" ] && PDIR="$RUNNER_TEMP/patches"
          for p in "$PDIR"/*.patch; do
            echo ">> $p"
            git apply --check "$p" && git apply "$p" || { echo "::warning::$p did not apply cleanly (skipped)"; }
          done

      - name: Set up KernelSU
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          curl -LSs "$KERNELSU_SETUP_SOURCE" -o /tmp/ksu_setup.sh
          [ -n "$KSU_EXPECTED_HASH" ] && echo "$KSU_EXPECTED_HASH  /tmp/ksu_setup.sh" | sha256sum -c -
          bash /tmp/ksu_setup.sh "$KERNELSU_TAG"
          if [ "$KSU_REVERT" = "true" ]; then git checkout -- . ; fi
          ls drivers | grep -i kernelsu || { echo "::error::KernelSU driver missing after setup"; exit 1; }
          grep -n kernelsu drivers/Makefile drivers/Kconfig

      - name: KernelSU / SUSFS compat fixes
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          # Tree ships SUSFS v2.3.0 where try_umount was removed (deprecated),
          # but the KernelSU fork's supercalls.c still calls susfs_add_try_umount().
          if grep -rq 'susfs_add_try_umount' drivers/kernelsu && ! grep -q 'susfs_add_try_umount' include/linux/susfs.h; then
            echo "Adding no-op susfs_add_try_umount() stub to include/linux/susfs.h"
            python3 - <<'PY'
          import re
          p = "include/linux/susfs.h"
          s = open(p).read()
          stub = ("\n/* compat stub: try_umount removed in SUSFS v2.x, still referenced by KernelSU */\n"
                  "static inline int susfs_add_try_umount(void *arg) { (void)arg; return 0; }\n")
          i = s.rfind("#endif")
          s = s[:i] + stub + "\n" + s[i:] if i != -1 else s + stub
          open(p, "w").write(s)
          PY
          fi
          # SUSFS v2.3.0 in this tree dropped susfs_try_umount() and made susfs_run_sus_path_loop()
          # static (it now runs from the susfs_extra_works workqueue). Older KernelSU forks still call
          # both from setuid_hook.c -> "undefined symbol" at link time. Provide compat shims.
          NEED_COMPAT=0
          for f in susfs_try_umount susfs_run_sus_path_loop; do
            if grep -rqE "\\b$f\\b" drivers/kernelsu && ! grep -qE "^(int|void|bool)[[:space:]]+$f\\(" fs/susfs.c; then NEED_COMPAT=1; fi
          done
          if [ "$NEED_COMPAT" = 1 ] && [ ! -f fs/susfs_compat.c ]; then
            echo "Adding fs/susfs_compat.c (susfs_try_umount / susfs_run_sus_path_loop shims)"
            cat > fs/susfs_compat.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          /* Compat shims so older KernelSU forks link against SUSFS v2.x */
          #include <linux/kernel.h>
          #include <linux/types.h>
          #include <linux/workqueue.h>

          extern struct work_struct susfs_extra_works;

          /* try_umount was removed from SUSFS v2.x (KernelSU does its own umount) */
          void susfs_try_umount(uid_t uid)
          {
          }

          /* In SUSFS v2.x the sus_path_loop runs from a workqueue instead of inline */
          void susfs_run_sus_path_loop(uid_t uid)
          {
          	if (susfs_extra_works.func)
          		schedule_work(&susfs_extra_works);
          }
          EOF
            grep -q susfs_compat fs/Makefile || sed -i '/^obj-\$(CONFIG_KSU_SUSFS) += susfs\.o/a obj-$(CONFIG_KSU_SUSFS) += susfs_compat.o' fs/Makefile
            grep -n susfs fs/Makefile
          fi
          # Diagnostic: SUSFS functions KernelSU calls that the tree does not declare
          grep -rhoE '\bsusfs_[a-z0-9_]+\(' drivers/kernelsu | tr -d '(' | sort -u | while read -r f; do
            grep -qE "\b$f\b" include/linux/susfs.h || echo "::warning::KernelSU uses $f but include/linux/susfs.h does not declare it"
          done

      - name: Build kernel
        run: |
          set -eo pipefail
          export ARCH="$KERNEL_ARCH" SUBARCH="$KERNEL_ARCH"
          [ "$ENABLE_CCACHE" = "true" ] && { export CCACHE_DIR=$HOME/.ccache; ccache -M 5G; CC_PREFIX="ccache clang"; } || CC_PREFIX="clang"

          # shellcheck disable=SC2206
          EXTRA=( $EXTRA_CMDS LOCALVERSION="$LOCALVERSION" )
          MK=( make -j"$(nproc)" O=out ARCH=arm64 CC="$CC_PREFIX" "${EXTRA[@]}" )

          # defconfig + per-device fragment (kernel 4.19 merges *.config fragments)
          "${MK[@]}" "$KERNEL_CONFIG_BASE"
          "${MK[@]}" "${KERNEL_CONFIG_FRAGMENT_DIR:+$KERNEL_CONFIG_FRAGMENT_DIR/}${{ matrix.device }}.config"

          # post-merge tweaks through scripts/config
          C="scripts/config --file out/.config"
          [ "$ENABLE_KERNELSU" = "true" ] && $C -e KSU
          [ "$ADD_KPROBES_CONFIG" = "true" ] && $C -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS
          [ "$ADD_OVERLAYFS_CONFIG" = "true" ] && $C -e OVERLAY_FS
          [ "$ADD_APATCH_SUPPORT" = "true" ] && $C -e KALLSYMS -e KALLSYMS_ALL
          [ "$DISABLE_LTO" = "true" ] && $C -d LTO_CLANG -d CFI_CLANG -d SHADOW_CALL_STACK -e LTO_NONE
          [ "$DISABLE_CC_WERROR" = "true" ] && $C -d CC_WERROR || true
          $C --set-str LOCALVERSION "$LOCALVERSION"
          "${MK[@]}" olddefconfig

          # build
          "${MK[@]}" 2>&1 | tee out/build.log
          test -f "out/arch/arm64/boot/$KERNEL_IMAGE_NAME" || { echo "::error::$KERNEL_IMAGE_NAME not produced"; tail -n 60 out/build.log; exit 1; }

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 -b "$ANYKERNEL3_BRANCH" "$ANYKERNEL3_SOURCE" AK3
          cp "out/arch/arm64/boot/$KERNEL_IMAGE_NAME" AK3/
          if [ "$NEED_DTBO" = "true" ] && [ -f out/arch/arm64/boot/dtbo.img ]; then cp out/arch/arm64/boot/dtbo.img AK3/; fi
          cd AK3 && rm -rf .git
          NAME="IceStoRM-${{ matrix.device }}-$(date +%Y%m%d)"
          zip -r9 "../$NAME.zip" . -x '*.git*' README.md
          echo "ZIP_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}.zip
            out/build.log
          if-no-files-found: error

      - name: Release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ${{ env.ZIP_NAME }}.zip
